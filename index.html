<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GREYPRINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --white: #f0ede6;
      --red: #c0392b;
      --muted: #888;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid #1e1e1e;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 2rem; }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--red); }

    /* HERO */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 600px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
    }

    #hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: grayscale(55%) contrast(1.1);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.15) 0%,
        rgba(10,10,10,0.0) 35%,
        rgba(10,10,10,0.9) 100%
      );
    }

    .hero-text {
      position: relative;
      z-index: 2;
      padding: 0 2rem 3.5rem;
      width: 100%;
    }

    .hero-text h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 18vw, 14rem);
      line-height: 0.85;
      letter-spacing: 0.04em;
      color: var(--white);
      text-shadow: 4px 4px 0 rgba(0,0,0,0.6);
    }

    .hero-text h1 span { color: var(--red); }

    .hero-tagline {
      margin-top: 0.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* SHOWS */
    #shows { border-top: 1px solid #1a1a1a; }

    .section-inner {
      padding: 5rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.62rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 0.6rem;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .shows-table {
      width: 100%;
      border-collapse: collapse;
    }

    .shows-table th {
      text-align: left;
      font-size: 0.58rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #252525;
    }

    .shows-table td {
      padding: 1.1rem 0;
      border-bottom: 1px solid #181818;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .shows-table tr:last-child td { border-bottom: none; }
    .shows-table tbody tr:hover td { background: rgba(192,57,43,0.06); }

    .show-date {
      color: var(--red);
      font-size: 0.82rem;
      white-space: nowrap;
      padding-right: 1.5rem;
      width: 140px;
    }

    .show-venue { color: var(--white); }

    .show-location {
      color: var(--muted);
      font-size: 0.78rem;
      padding-left: 1rem;
    }

    .show-link {
      text-align: right;
      white-space: nowrap;
      padding-left: 1rem;
    }

    .show-link a {
      display: inline-block;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      background: var(--white);
      padding: 0.35rem 0.85rem;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .show-link a:hover { background: var(--red); color: var(--white); }

    #shows-status {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      padding: 1.5rem 0;
    }

    #shows-status.error { color: var(--red); }

    /* FOOTER */
    footer {
      border-top: 1px solid #1a1a1a;
      padding: 2rem;
      text-align: center;
      font-size: 0.6rem;
      color: #3a3a3a;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .show-location,
      .show-link,
      .shows-table th:nth-child(3),
      .shows-table th:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="#">Greyprint</a>
    <div class="nav-links">
      <a href="#shows">Shows</a>
      <a href="mailto:hello@greyprint.com">Contact</a>
    </div>
  </nav>

  <!-- ════════════════════════════════════
       HERO IMAGE
       Put your photo in the same folder
       as index.html and update the src.
       e.g.  src="band.jpg"
  ════════════════════════════════════ -->
  <section id="hero">
    <img id="hero-img" src="hero.jpg" alt="Greyprint" />
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <h1>Grey<span>print</span></h1>
      <p class="hero-tagline">Loud &nbsp;·&nbsp; Raw &nbsp;·&nbsp; Live</p>
    </div>
  </section>

  <!-- SHOWS -->
  <section id="shows">
    <div class="section-inner">
      <p class="section-label">On tour</p>
      <h2 class="section-title">Shows</h2>

      <div id="shows-status">Loading shows...</div>

      <table class="shows-table" id="shows-table" style="display:none">
        <thead>
          <tr>
            <th>Date</th>
            <th>Venue</th>
            <th>Location</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="shows-body"></tbody>
      </table>
    </div>
  </section>

  <footer>
    &copy; <span id="yr"></span> Greyprint &nbsp;·&nbsp; All rights reserved
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // ════════════════════════════════════════════════════════
    // HOW TO CONNECT YOUR GOOGLE SHEET
    //
    // 1. Create a Google Sheet with these columns in row 1:
    //      Date | Venue | Location | Tickets
    //
    //    Example row:
    //      May 10 2025 | The Fillmore | San Francisco, CA | https://ticketmaster.com/...
    //
    //    (Leave Tickets blank if no link yet)
    //
    // 2. File → Share → Publish to web
    //    → Select "Sheet1" and "Comma-separated values (.csv)"
    //    → Click Publish → Copy the URL
    //
    // 3. Paste that URL below, replacing the placeholder.
    //
    // To update shows: just edit your Google Sheet.
    // The site fetches fresh data every time someone loads the page.
    // ════════════════════════════════════════════════════════

    const SHEET_CSV_URL = 'YOUR_GOOGLE_SHEET_CSV_URL_HERE';

    async function loadShows() {
      const status = document.getElementById('shows-status');
      const table  = document.getElementById('shows-table');
      const tbody  = document.getElementById('shows-body');

      if (SHEET_CSV_URL === 'YOUR_GOOGLE_SHEET_CSV_URL_HERE') {
        status.textContent = '— No shows listed yet —';
        return;
      }

      try {
        const res = await fetch(SHEET_CSV_URL);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        const rows = text.trim().split('\n').slice(1); // skip header

        if (!rows.length || rows[0].trim() === '') {
          status.textContent = '— No shows listed yet —';
          return;
        }

        tbody.innerHTML = '';

        rows.forEach(row => {
          // Handle quoted CSV fields (Google Sheets sometimes wraps commas in quotes)
          const cols = [];
          let current = '';
          let inQuotes = false;
          for (const ch of row) {
            if (ch === '"') { inQuotes = !inQuotes; }
            else if (ch === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
            else { current += ch; }
          }
          cols.push(current.trim());

          const [date, venue, location, tickets] = cols;
          if (!date && !venue) return;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="show-date">${date || ''}</td>
            <td class="show-venue">${venue || ''}</td>
            <td class="show-location">${location || ''}</td>
            <td class="show-link">${tickets ? `<a href="${tickets}" target="_blank" rel="noopener">Tickets &rarr;</a>` : ''}</td>
          `;
          tbody.appendChild(tr);
        });

        status.style.display = 'none';
        table.style.display = 'table';

      } catch (err) {
        status.className = 'error';
        status.textContent = 'Could not load shows. Check back soon.';
        console.error(err);
      }
    }

    loadShows();
  </script>

</body>
</html>
