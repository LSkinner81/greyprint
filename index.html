<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GREYPRINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @font-face {
      font-family: 'LWS_font';
      src: url('LWS_font.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --black: #0a0a0a;
      --white: #f0ede6;
      --red: #c0392b;
      --muted: #888;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 1.5rem;
      padding: 1.2rem 2rem;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid #1e1e1e;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
    }

    .nav-social {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .nav-social a {
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .nav-social a:hover { color: var(--red); }

    .nav-social svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      margin-left: auto;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'LWS_font', monospace;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .nav-links a:hover { color: var(--red); }

    /* HAMBURGER */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      margin-left: auto;
      background: none;
      border: none;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--white);
      transition: background 0.2s;
    }

    .hamburger:hover span { background: var(--red); }

    /* MOBILE MENU */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 62px; left: 0; right: 0;
      background: rgba(10,10,10,0.97);
      border-bottom: 1px solid #1e1e1e;
      padding: 1.5rem 2rem;
      z-index: 99;
      flex-direction: column;
      gap: 1.5rem;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      color: var(--muted);
      text-decoration: none;
      font-family: 'LWS_font', monospace;
      font-size: 1.2rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .mobile-menu a:hover { color: var(--red); }

    .mobile-social {
      display: flex;
      gap: 1.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #1e1e1e;
      align-items: center;
    }

    .mobile-social a {
      font-size: 0;
      display: flex;
      align-items: center;
    }

    .mobile-social svg {
      width: 22px;
      height: 22px;
      fill: var(--muted);
      transition: fill 0.2s;
    }

    .mobile-social a:hover svg { fill: var(--red); }

    /* HERO */
    #hero {
      position: relative;
      height: 75vh;
      min-height: 400px;
      display: flex;
      align-items: flex-start;
      overflow: hidden;
    }

    #hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      filter: grayscale(30%) contrast(1.0) brightness(1.1);
      padding-top: 70px;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
    }

    /* TAGLINE */
    .hero-tagline-wrap {
      text-align: center;
      padding: 1.5rem 1rem;
    }

    .hero-tagline {
      font-family: 'LWS_font', monospace;
      font-size: clamp(1.2rem, 5vw, 3rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--white);
      white-space: nowrap;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #1a1a1a;
      padding: 2rem;
      text-align: center;
      font-size: 0.6rem;
      color: #3a3a3a;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    /* MOBILE */
    @media (max-width: 640px) {
      .nav-social,
      .nav-links { display: none; }
      .hamburger { display: flex; }

      .hero-tagline { letter-spacing: 0.2em; }

      .hero-tagline-wrap {
        padding: 0.5rem 1rem;
        margin-top: -2.5rem;
      }

      .hero-tagline { font-size: 1.8rem; }
    }
  </style>
</head>
