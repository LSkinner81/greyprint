<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GREYPRINT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
@font-face {
     font-family: monospace;
      src: url('./LWS_font.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    :root {
      --black: #0a0a0a;
      --white: #f0ede6;
      --red: #c0392b;
      --muted: #888;
    }

    html, body { height: 100%; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Share Tech Mono', monospace;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(4px);
      border-bottom: 1px solid #1e1e1e;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.15em;
      color: var(--white);
      text-decoration: none;
    }

    .nav-links { display: flex; gap: 2rem; }

   .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--red); }

    /* HERO */
    #hero {
      position: relative;
      height: 75vh;
      min-height: 400px;
      display: flex;
      align-items: flex-start;
      overflow: hidden;
    }

    #hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
     filter: grayscale(30%) contrast(1.0) brightness(1.0);
      padding-top: 70px;
    }

   .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
    }

   .hero-text {
      position: relative;
      z-index: 10;
      padding: 2rem;
      width: 100%;
     
    }

    .hero-tagline {
      font-family: 'LWS', monospace;
      font-size: 2rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--white);
      text-align: center;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #1a1a1a;
      padding: 2rem;
      text-align: center;
      font-size: 0.6rem;
      color: #3a3a3a;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Greyprint</a>
    <div class="nav-links">
      <a href="shows.html">Shows</a>
      <a href="mailto:hello@greyprint.com">Contact</a>
    </div>
  </nav>

  <section id="hero">
    <img id="hero-img" src="hero.jpg" alt="Greyprint" />
    <div class="hero-overlay"></div>
    <div class="hero-text">
      <p class="hero-tagline">Loud &nbsp;·&nbsp; Fast &nbsp;·&nbsp; Old</p>
    </div>
  </section>

  <footer>
    &copy; <span id="yr"></span> Greyprint &nbsp;·&nbsp; All rights reserved
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>

</body>
</html>
